services:
  - type: web
    name: idea-atelier-api
    runtime: python
    plan: free
    rootDir: v2/backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idea-atelier-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: AUTH_REQUIRED
        value: "true"
      - key: ALLOW_SIGNUPS
        value: "true"
      - key: INVITE_CODE
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DAILY_GENERATION_LIMIT
        value: "20"
      - key: TRUSTED_HOSTS
        value: "*.onrender.com"
      - key: CORS_ORIGINS
        value: https://idea-atelier-web.onrender.com

  - type: web
    name: idea-atelier-web
    runtime: node
    plan: free
    rootDir: v2/frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: API_ORIGIN
        value: https://idea-atelier-api.onrender.com

databases:
  - name: idea-atelier-db
    plan: free
    databaseName: idea_atelier
    user: idea_atelier
